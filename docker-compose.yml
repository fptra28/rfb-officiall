version: "3.8"

services:
  rfb-official:
    image: rifan-financindo-berjangka-rfb-official:latest
    container_name: rfb-official
    build:
      context: .
      args:
        # These are baked at build-time into the client bundle (Next.js NEXT_PUBLIC_*)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_DEV_URL: ${NEXT_PUBLIC_DEV_URL}
        NEXT_PUBLIC_IMAGE_HOSTNAME: ${NEXT_PUBLIC_IMAGE_HOSTNAME}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL}

        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
        NEXT_PUBLIC_FIREBASE_ANALYTICS_ENABLED: ${NEXT_PUBLIC_FIREBASE_ANALYTICS_ENABLED}
        NEXT_PUBLIC_FIREBASE_ANALYTICS_DEBUG: ${NEXT_PUBLIC_FIREBASE_ANALYTICS_DEBUG}
        NEXT_PUBLIC_FIREBASE_ANALYTICS_LOG: ${NEXT_PUBLIC_FIREBASE_ANALYTICS_LOG}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-https://rfbdev.newsmaker.id}
      UPSTREAM_DNS_SERVERS: ${UPSTREAM_DNS_SERVERS:-8.8.8.8,1.1.1.1}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    networks:
      - rfb-network

networks:
  rfb-network:
    external: true
